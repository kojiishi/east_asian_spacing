[project]
name = "east_asian_spacing"
dynamic = ["version"]
description = "East Asian Contextual Spacing Build Tools"
authors = [{name = "Koji Ishii", email="kojii@chromium.org"}]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fonttools[woff]>=4.57.0",
    "uharfbuzz>=0.50.2",
]

[project.urls]
repository = "https://github.com/kojiishi/east_asian_spacing"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.20",
    "tox>=4.25.0",
    "tox-uv>=1.13.1",
    "yapf>=0.43.0",
]

[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm>=10.2.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
east-asian-spacing = 'east_asian_spacing.__main__:main'

[tool.pytest.ini_options]
testpaths = "tests"

[tool.ruff.lint]
ignore = [
    "C400", # Unnecessary generator (rewrite as a list comprehension)
    "C401", # Unnecessary generator (rewrite as a set comprehension)
    "C405", # Unnecessary tuple literal (rewrite as a set literal)
    "C408", # Unnecessary `tuple()` call (rewrite as a literal)
    "C417", # Unnecessary `map()` usage (rewrite using a generator expression)
    "LOG015", # `info()` call on root logger
    "PLR0206", # Cannot have defined parameters for properties
    "PLR0402", # Use `from east_asian_spacing import utils` in lieu of alias
    "RUF012", # Mutable default value for class attribute
    "RUF022", # `__all__` is not sorted
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM103", # Return the condition directly
    "TRY002", # Create your own exception
    "UP004", # Class EastAsianSpacingTester` inherits from `object`
    "UP006", # Use `set` instead of `Set` for type annotation
    "UP007", # Use `X | Y` for type annotations
    "UP030", # Use implicit references for positional format fields
    "UP032", # Use f-string instead of `format` call
    "UP034", # Avoid extraneous parentheses
    "UP035", # `...` is deprecated, use `...` instead
    "UP045", # Use `X | None` for type annotations
]

[tool.setuptools_scm]
# https://github.com/pypa/setuptools-scm
version_file = "src/east_asian_spacing/_version.py"
# https://github.com/dependabot/dependabot-core/issues/12340
fallback_version = "0.0.0"

[tool.yapf]
based_on_style = "pep8"
